<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Royal Cars — Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="loginStyle.css"/>
  <script src="loginScript.js" defer></script>
</head>
<body>
<div class="login-wrap">
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><path d="M5 17H3a2 2 0 01-2-2V9a2 2 0 012-2h1l3-4h8l3 4h1a2 2 0 012 2v6a2 2 0 01-2 2h-2m-8 0h6m-6 0a1 1 0 110 2 1 1 0 010-2zm6 0a1 1 0 110 2 1 1 0 010-2z"/></svg>
    </div>
    <div class="logo-name">Royal<span>Cars</span></div>
  </div>

  <div class="card">
    <div class="card-title">Espace administrateur</div>
    <div class="card-sub">Connectez-vous pour gérer la flotte et les réservations.</div>

    <div class="error-msg" id="error-msg">Email ou mot de passe incorrect.</div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="admin@royalcars.cm" />
    </div>
    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"/>
    </div>
    <button class="btn-login" onclick="login()">Se connecter →</button>
  </div>

  <div class="footer-link">
    <a href="https://royalcars237.vercel.app/" target="_blank">← Retour au site Royal Cars</a>
  </div>
</div>

</body>
</html>
